name: PTIV Neon Pearl Triangle face (isolated WFF)
on:
  push:
    branches: [ feature/ptiv-neon-pearl-face-20261114 ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build only isolated WFF face
        working-directory: wear
        run: gradle --no-daemon :faceneonpearl:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PTIV-Neon-Pearl-Face-Test-APK
          path: wear/faceneonpearl/build/outputs/apk/debug/faceneonpearl-debug.apk
          if-no-files-found: error
