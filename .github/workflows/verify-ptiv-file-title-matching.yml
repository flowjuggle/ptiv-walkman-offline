name: Verify PTIV watch filename matching (test only)
on:
  push:
    branches: [ fix/watch-ptiv-file-title-matching-20261114 ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile test APK only
        working-directory: wear
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PTIV-Watch-Metadata-Fallback-Candidate
          path: wear/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
