name: Build PTIV Watch APK (test only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The runner already has Android command-line tools. The setup-android
      # action requests obsolete SDK package "tools" and fails on current runners.
      - name: Ensure Android SDK platforms
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found"; exit 1; fi
          echo "SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: wear
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload watch APK
        uses: actions/upload-artifact@v4
        with:
          name: PTIV-Walkman-WearOS-test-APK
          path: wear/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
