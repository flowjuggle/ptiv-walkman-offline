plugins { id 'com.android.application' }

android {
  namespace 'live.ptiv.watch'
  compileSdk 35
  defaultConfig {
    applicationId 'live.ptiv.watch'
    minSdk 30
    targetSdk 34
    versionCode 1
    versionName '0.1-offline-test'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

tasks.register('syncPTIVCatalog', Copy) {
  from file('../../ptiv-catalog.json')
  into file('src/main/assets')
}
tasks.named('preBuild').configure { dependsOn 'syncPTIVCatalog' }
