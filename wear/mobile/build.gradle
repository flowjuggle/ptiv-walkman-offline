plugins { id 'com.android.application' }

android {
  namespace 'live.ptiv.companion'
  compileSdk 35
  defaultConfig {
    applicationId 'live.ptiv.watch'
    minSdk 28
    targetSdk 34
    versionCode 3
    versionName '0.3-phone-test'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
dependencies { implementation 'com.google.android.gms:play-services-wearable:20.0.1' }
tasks.register('syncPTIVCatalog', Copy) {
  from file('../../ptiv-catalog.json')
  into file('src/main/assets')
}
tasks.named('preBuild').configure { dependsOn 'syncPTIVCatalog' }
