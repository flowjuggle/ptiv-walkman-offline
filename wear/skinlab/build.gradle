plugins { id 'com.android.application' }

android {
  namespace 'live.ptiv.skinlab'
  compileSdk 35
  defaultConfig {
    applicationId 'live.ptiv.skinlab'
    minSdk 28
    targetSdk 34
    versionCode 1
    versionName '0.1-preview'
  }
  flavorDimensions 'appearance'
  productFlavors {
    cassette {
      dimension 'appearance'
      applicationIdSuffix '.cassette'
      resValue 'string', 'app_name', 'PTIV Cassette Lab'
      buildConfigField 'int', 'SKIN', '0'
    }
    orbit {
      dimension 'appearance'
      applicationIdSuffix '.orbit'
      resValue 'string', 'app_name', 'PTIV Orbit Lab'
      buildConfigField 'int', 'SKIN', '1'
    }
    lyrics {
      dimension 'appearance'
      applicationIdSuffix '.lyrics'
      resValue 'string', 'app_name', 'PTIV Lyrics Lab'
      buildConfigField 'int', 'SKIN', '2'
    }
  }
  buildFeatures { buildConfig true }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
